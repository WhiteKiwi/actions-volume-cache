# Requires rustup on the runner, a committed Cargo.lock, and a Cargo project.
name: Rust CI with local cache
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux] # Replace with your runner labels or ARC scale-set name.
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select and identify Rust toolchain
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          echo "version=$(rustc +stable --version)" >> "$GITHUB_OUTPUT"
      - name: Restore and update Cargo cache
        id: local-cache
        uses: WhiteKiwi/actions-volume-cache@b8b00a6601529c337a7f70b82a6dc7ad10c7519d
        with:
          volume-path: /cache
          # Omit paths your project never creates; missing units make cache-hit 'false'.
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-cargo-
      - run: cargo +stable test --locked
