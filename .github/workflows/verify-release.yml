name: Verify published action
on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Expected full release commit SHA (optional for a manual observation)
        type: string
      major-tag:
        description: Public major tag to download
        default: v1
        type: string
  workflow_call:
    inputs:
      expected-sha:
        required: true
        type: string
      major-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  published-action:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected-sha || github.sha }}
          persist-credentials: false
      # `uses: owner/repo@ref` cannot use an expression. Download the public tag
      # explicitly, verify its commit, then run that complete downloaded action.
      - name: Download published major tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WhiteKiwi/actions-volume-cache
          ref: ${{ inputs.major-tag || 'v1' }}
          path: .cache/published-action
          persist-credentials: false
      - name: Verify downloaded release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          actual_sha=$(git -C .cache/published-action rev-parse HEAD)
          echo "Downloaded published action: $actual_sha"
          if [ -n "$EXPECTED_SHA" ]; then
            test "$actual_sha" = "$EXPECTED_SHA"
          fi
      - name: Prepare synthetic volume
        run: |
          mkdir -p "$RUNNER_TEMP/avc-release"
          echo "AVC_LIFECYCLE_VOLUME=$RUNNER_TEMP/avc-release" >> "$GITHUB_ENV"
      # The observer's post runs after the published action's save post.
      - name: Observe published action save
        uses: ./tests/fixtures/post-observer
        with:
          expected: saved
      - name: Use downloaded published action
        id: cache
        uses: ./.cache/published-action
        with:
          path: .cache/lifecycle-target
          key: lifecycle
          volume-path: ${{ env.AVC_LIFECYCLE_VOLUME }}
      - name: Verify cold miss and create output
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test -z "$CACHE_HIT"
          mkdir -p .cache/lifecycle-target
          printf 'lifecycle-data' > .cache/lifecycle-target/value
